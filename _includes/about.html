<!-- Team Section -->
    <section id="about" class="bg-light-gray">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">About Me</h2>
                </div>
            </div>
            <div class="row">
                {% for member in site.people %}
                    <div class="col-md-5 col-sm-6">
                        <div class="team-member">
                            <img src="img/team/{{ member.pic }}.jpg" class="img-responsive img-circle" alt="">
                            <h4>{{ member.name }}</h4>
                            <p class="text-muted">{{ member.position }}</p>
                            <ul class="list-inline social-buttons">
                                {% for network in member.social %}
                                <li>
                                    <a href="{{ network.url }}">
                                        <i class="fa fa-{{ network.title }}"></i>
                                    </a>
                                </li>
                                {% endfor %}
                            </ul>
                        </div>
                    </div>      
                {% endfor %}
                <div class="col-md-7 col-sm-6 about-contents">
                    <p class="lead">我是 <strong>胡勝紘</strong>，一個熱衷實作的機械系學生。</p>
                    <p>擅長使用 <strong>Onshape</strong> 進行 3D 建模，並透過 <strong>3D 列印</strong>與<strong>雷切</strong>將想法實體化。</p>
                    <p>同時我也在深入探究 <strong>C++、Arduino 及 ESP32</strong> 的程式領域，為作品增加多樣性。</p>
                </div>
            </div>
        </div>
    </section>
